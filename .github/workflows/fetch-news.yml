name: Climate-risk research digest

# Runs every two days: pulls new items from public journal/agency/trade-press
# RSS feeds and Google News searches (see scripts/fetch_news.py) into
# _data/news.yml, then opens a pull request with a readable digest as the PR
# description so you can review before anything is published to /news/.
# Nothing goes live automatically.
#
# Cron day-of-month "*/2" fires on the 1st, 3rd, 5th... of each month at
# 07:00 UTC — an every-other-day cadence. GitHub disables schedules after
# 60 days without any repo activity; push a commit or re-enable it from the
# Actions tab if that happens.
#
# Deliberately does not touch LinkedIn — see scripts/fetch_news.py for why.
on:
  schedule:
    - cron: "0 7 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  research-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser pyyaml

      - run: python scripts/fetch_news.py

      - name: Open PR with the digest as description
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(news): climate-risk research digest"
          title: "Climate-risk research digest — ${{ github.run_id }}"
          body-path: digest.md
          branch: automated/fetch-news
          add-paths: _data/news.yml
          delete-branch: true

      - name: Clean up digest artifact
        run: rm -f digest.md
