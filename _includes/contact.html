{% assign p = site.data.profile %}
<section class="container contact" id="contact">
    <div class="contact-container">
        <div class="main-title">
            <h2>Contact <span>Me</span><span class="bg-text">Contact</span></h2>
        </div>
        <div class="contact-content-con">
            <div class="left-contact">
                <h4>Contact me here</h4>
                <p>{{ p.contact_intro }}</p>
                <div class="contact-info">
                    <div class="contact-item">
                        <div class="icon"><i class="fas fa-map-marker-alt"></i><span>Location</span></div>
                        <p>: {{ p.location }}</p>
                    </div>
                    <div class="contact-item">
                        <div class="icon"><i class="fas fa-envelope"></i><span>Email</span></div>
                        <p><span>: {{ p.email }}</span></p>
                    </div>
                    <div class="contact-item">
                        <div class="icon"><i class="fas fa-user-graduate"></i><span>Education</span></div>
                        <p><span>: {{ p.education_short }}</span></p>
                    </div>
                    <div class="contact-item">
                        <div class="icon"><i class="fas fa-phone"></i><span>Mobile Number</span></div>
                        <p><span>: {{ p.phone }}</span></p>
                    </div>
                    <div class="contact-item">
                        <div class="icon"><i class="fas fa-globe-africa"></i><span>Languages</span></div>
                        <p><span>: {{ p.languages }}</span></p>
                    </div>
                </div>
                <div class="contact-icons">
                    {% include social-icons.html %}
                </div>
            </div>
            <div class="right-contact">
                <!--
                  Static GitHub Pages site: this posts to Formspree by default.
                  Replace YOUR_FORM_ID with your own form at https://formspree.io.
                -->
                <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <div class="input-control i-c-2">
                        <input type="text" name="name" required placeholder="YOUR NAME">
                        <input type="email" name="email" required placeholder="YOUR EMAIL">
                    </div>
                    <div>
                        <div class="input-control">
                            <input type="text" name="subject" required placeholder="ENTER SUBJECT">
                        </div>
                        <div class="input-control">
                            <textarea name="message" cols="15" rows="8" placeholder="Message Here..." required></textarea>
                        </div>
                    </div>
                    <div>
                        <button class="main-btn submit-btn-el" type="submit">
                            <span class="btn-text">Submit</span>
                            <span class="btn-icon"><i class="fas fa-paper-plane"></i></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
