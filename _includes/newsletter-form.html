<!--
  Newsletter signup form.
  GitHub Pages is static (no server), so this posts to Formspree's free
  hosted endpoint by default — replace YOUR_FORM_ID with your own at
  https://formspree.io, or swap the form action for Mailchimp/Buttondown/
  ConvertKit later. See CONTENT-GUIDE.md.
-->
<form class="subscribe-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <input type="hidden" name="form-name" value="newsletter-signup">
    <input type="email" name="email" required placeholder="you@example.com" aria-label="Email address">
    <button type="submit">Subscribe</button>
</form>
