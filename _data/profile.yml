  experience_body: >-
    I have contributed to developing and underwriting parametric and index-based
    reinsurance solutions and developing software platforms for satellite-based
    CO2 emissions and wildfire burned area monitoring. Proven expertise in
    Natural Catastrophe modelling (Tropical Cyclone, Earthquake, Flooding, SCS,
    Wildfire, etc.), climate risk assessment, and insurance structuring product
    development, leveraging deep knowledge of the (re)insurance value chain to
    design scalable, client-focused solutions. Adept at using machine learning,
    spatial data engineering, satellite and meteorological data processing, and
    time series analysis to price and innovate climate-linked insurance products.

    Skilled in Python, R, SQL/NoSQL, and cloud platforms (AWS, Azure, GCP) with
    a passion for building robust tools that drive automation and analytics at
    scale. Successfully led the deployment of a cloud-based parametric pricing
    platform and worked cross-functionally with technical and commercial teams
    to deliver impactful solutions. An exceptional communicator and
    collaborator, capable of translating complex datasets into actionable
    insights for clients and stakeholders.
