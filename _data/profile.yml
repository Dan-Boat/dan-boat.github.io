intro: >-
  I bring a unique blend of engineering training and a PhD in climate modeling
  (computational geoscience), combined with over six years of experience across
  both industry and research. My expertise lies in applying advanced computational
  skills—including Earth Observation Data Science, Geospatial Data Engineering,
  Machine Learning, Artificial Intelligence, Physics-based Numerical Modeling,
  High-Performance Computing, Cloud Computing Architecture (AWS, Oracle, Azure,
  GCP, OpenStack), and Time Series Modeling—to solve complex, real-world problems.

  I have delivered impactful solutions in diverse fields such as weather
  forecasting, geophysics, water resource management, geotechnical engineering,
  software development, climate and weather risk modeling, and the reinsurance
  industry. Collaborating with multinational teams has made me highly adaptable,
  culturally agile, and an effective team player.

  Currently, I apply my multidisciplinary expertise in geospatial analytics and
  weather and climate risk modeling within the reinsurance industry (Property &
  Casualty insurance). My focus spans natural catastrophes (e.g., tropical
  cyclones, flooding), agricultural risks, weather derivatives, and business
  interruption risks. Additionally, I am developing and maintaining geospatial
  data infrastructure on AWS to enable remote querying and generative AI
  analytics of satellite datasets, integrated with Azure DevOps pipelines to
  drive actionable business insights.

